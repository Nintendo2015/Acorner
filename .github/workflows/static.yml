
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acorner | Supplier</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    color: #222;
    background: #fff;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 8%;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 0;
    background: white;
    z-index: 10;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.logo img {
    max-width: 150px;
    height: 45px;
    object-fit: contain;
}

nav {
    display: flex;
    gap: 22px;
}

nav a {
    color: #333;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
}

nav a:hover {
    color: #999;
}

.hero {
    padding: 85px 8%;
    background: #f8f8f8;
    text-align: center;
}

.hero h1 {
    font-size: 43px;
    margin-bottom: 15px;
}

.hero p {
    color: #777;
    margin-bottom: 25px;
}

.btn {
    display: inline-block;
    background: #171717;
    color: white;
    padding: 13px 25px;
    border-radius: 5px;
    border: none;
    text-decoration: none;
    cursor: pointer;
}

section {
    padding: 55px 8%;
}

.section-title {
    font-size: 28px;
    margin-bottom: 30px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
}

.product {
    aspect-ratio: 1 / 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #eee;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: white;
    transition: .2s;
}

.product:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 20px #0000000d;
}

.product img {
    width: 100%;
    height: 52%;
    object-fit: contain;
    background: #fafafa;
    border-radius: 7px;
    flex-shrink: 0;
}

.product-info {
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
}

.product-info h3 {
    font-size: 15px;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.description {
    font-size: 11px;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.price {
    font-size: 19px;
    font-weight: bold;
    margin: 5px 0;
}

.stock {
    color: #888;
    font-size: 11px;
    margin-bottom: 5px;
}

.stars {
    color: #d49b20;
    font-size: 12px;
    margin-bottom: 7px;
}

.product button,
.admin-container button,
.chat-container button {
    padding: 10px;
    background: #171717;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.product button {
    margin-top: auto;
    width: 100%;
}

/* ADMIN */

#adminPage,
#messagesPage {
    display: none;
    min-height: 80vh;
    background: #f8f8f8;
}

.admin-container {
    max-width: 700px;
    margin: auto;
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 30px;
}

.admin-container h2 {
    margin-bottom: 15px;
}

.admin-container h3 {
    margin: 25px 0 15px;
}

.admin-container input,
.admin-container textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-family: Arial;
}

.admin-container textarea {
    min-height: 80px;
}

.admin-container label {
    font-size: 13px;
    font-weight: bold;
}

.hidden {
    display: none !important;
}

.admin-product,
.chat-item {
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.delete-btn {
    background: #b33 !important;
    margin-top: 8px;
}

#contacts p {
    line-height: 1.6;
}

/* MENSAGENS */

#messagesPage {
    padding: 45px 8%;
}

.chat-container {
    max-width: 750px;
    margin: auto;
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 25px;
}

.chat-header {
    padding-bottom: 18px;
    border-bottom: 1px solid #eee;
    margin-bottom: 20px;
}

.chat-messages {
    height: 350px;
    overflow-y: auto;
    padding: 15px;
    background: #fafafa;
    border-radius: 8px;
    margin-bottom: 15px;
}

.message {
    max-width: 80%;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.message.client {
    background: #eee;
    margin-right: auto;
}

.message.admin {
    background: #171717;
    color: white;
    margin-left: auto;
}

.message small {
    display: block;
    font-size: 10px;
    opacity: .65;
    margin-top: 6px;
}

.chat-form input,
.chat-form textarea,
#chatIdentity input,
#adminReply {
    width: 100%;
    padding: 12px;
    margin: 8px 0 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-family: Arial;
}

.chat-form textarea {
    min-height: 90px;
    resize: vertical;
}

footer {
    text-align: center;
    padding: 35px;
    border-top: 1px solid #eee;
    color: #888;
    font-size: 13px;
}

@media(max-width:600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    nav {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .hero h1 {
        font-size: 31px;
    }

    .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .product {
        padding: 8px;
    }

    .product-info h3 {
        font-size: 13px;
    }

    .price {
        font-size: 16px;
    }

    #messagesPage {
        padding: 25px 5%;
    }

    .chat-container {
        padding: 15px;
    }

    .chat-messages {
        height: 300px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo" id="logo">ACORNER.</div>

    <nav>
        <a onclick="showPage('home')">Início</a>
        <a onclick="showPage('products')">Produtos</a>
        <a onclick="showPage('admin')">Admin</a>
        <a onclick="showPage('contacts')">Contactos</a>
    </nav>
</header>

<!-- LOJA -->

<main id="shopPage">

    <div class="hero" id="home">
        <h1>ACORNER SUPPLIER</h1>
        <p>O teu fornecedor para começar e desenvolver o teu negócio.</p>
        <button class="btn" onclick="showPage('products')">
            Explorar produtos
        </button>
    </div>

    <section id="products">
        <h2 class="section-title">O nosso catálogo</h2>
        <div class="products" id="productList"></div>
    </section>

    <section id="contacts">
        <h2 class="section-title">Contactos</h2>
        <p>Queres trabalhar com a Acorner? Entra em contacto connosco.</p>
        <p style="margin-top:15px">
            Email:
            <a href="mailto:pessoaltrabalho037@gmail.com">
                pessoaltrabalho037@gmail.com
            </a>
        </p>
    </section>

</main>

<!-- MENSAGENS -->

<section id="messagesPage">

    <div class="chat-container">

        <div class="chat-header">
            <h2>Mensagens Acorner</h2>
            <p id="chatProduct" style="color:#888;margin-top:8px">
                Contacto com a Acorner
            </p>
        </div>

        <div id="chatIdentity">
            <label>O teu nome</label>
            <input id="clientName" placeholder="Nome">

            <label>O teu email</label>
            <input id="clientEmail" type="email" placeholder="Email">

            <button onclick="startChat()">Começar conversa</button>
        </div>

        <div id="chatArea" class="hidden">

            <div id="chatMessages" class="chat-messages"></div>

            <div class="chat-form">
                <textarea id="chatInput" placeholder="Escreve a tua mensagem..."></textarea>
                <button onclick="sendClientMessage()">Enviar mensagem</button>
            </div>

        </div>

        <button onclick="showPage('home')" style="margin-top:20px">
            Voltar à loja
        </button>

    </div>

</section>

<!-- ADMINISTRAÇÃO -->

<section id="adminPage">

    <div class="admin-container">

        <h2>ACORNER ADMIN</h2>
        <p style="color:#888">Painel de gestão da empresa.</p>

        <div id="loginBox">

            <h3>Iniciar sessão</h3>

            <label>Email</label>
            <input type="email" id="adminEmail"
            placeholder="Email de administrador">

            <label>Palavra-passe</label>
            <input type="password" id="adminPassword"
            placeholder="Palavra-passe">

            <button onclick="login()">Entrar</button>

            <p id="loginMessage" style="color:#b33;margin-top:12px"></p>

        </div>

        <div id="adminPanel" class="hidden">

            <h3>Adicionar produto</h3>

            <label>Nome</label>
            <input id="name" placeholder="Nome do produto">

            <label>Preço (€)</label>
            <input id="price" type="number" min="0" step="0.01">

            <label>Stock</label>
            <input id="stock" type="number" min="0" step="1">

            <label>Descrição</label>
            <textarea id="description"
            placeholder="Descrição do produto"></textarea>

            <label>Imagem do produto</label>
            <input id="image" type="file" accept="image/*">

            <button onclick="addProduct()">Publicar produto</button>

            <h3>Personalizar logótipo</h3>

            <input type="file" id="logoImage" accept="image/*">

            <button onclick="changeLogo()">Alterar logótipo</button>

            <div id="adminProducts"></div>

            <h3>Caixa de mensagens</h3>
            <div id="adminInbox"></div>

            <div id="adminChat" class="hidden">
                <h3 id="adminChatTitle">Conversa</h3>
                <div id="adminChatMessages" class="chat-messages"></div>

                <textarea id="adminReply"
                placeholder="Escreve uma resposta..."></textarea>

                <button onclick="sendAdminReply()">Enviar resposta</button>

                <button onclick="closeAdminChat()"
                style="background:#777;margin-top:8px">
                    Fechar conversa
                </button>
            </div>

            <button onclick="logout()"
            style="margin-top:25px;background:#777">
                Terminar sessão
            </button>

        </div>

    </div>

</section>

<footer>
    <p>© 2026 Acorner Supplier. Todos os direitos reservados.</p>
    <p style="margin-top:8px">Construído para revendedores.</p>
</footer>

<script>

// CONFIGURAÇÃO

const ADMIN_EMAIL = "oafonso737@gmail.com";
const ADMIN_PASSWORD = "Ac0rner!Stock#72_Reseller2026";

let products = JSON.parse(
    localStorage.getItem("acornerProducts") || "[]"
);

let conversations = JSON.parse(
    localStorage.getItem("acornerMessages") || "[]"
);

let isAdmin = false;
let currentChatId = null;
let selectedAdminChat = null;
let selectedProductName = "Contacto geral";

// NAVEGAÇÃO

function showPage(page) {

    const shop = document.getElementById("shopPage");
    const admin = document.getElementById("adminPage");
    const messages = document.getElementById("messagesPage");

    shop.style.display = "none";
    admin.style.display = "none";
    messages.style.display = "none";

    if (page === "admin") {

        admin.style.display = "block";

        if (isAdmin) {
            renderInbox();
        }

    } else if (page === "messages") {

        messages.style.display = "block";

    } else {

        shop.style.display = "block";

        if (page === "products") {
            document.getElementById("products").scrollIntoView();
        }

        if (page === "contacts") {
            document.getElementById("contacts").scrollIntoView();
        }

        if (page === "home") {
            window.scrollTo(0,0);
        }
    }
}

// PROTEÇÃO DE TEXTO

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

// PRODUTOS

function renderProducts() {

    const list = document.getElementById("productList");
    list.innerHTML = "";

    if (products.length === 0) {
        list.innerHTML =
        "<p style='color:#888'>Ainda não existem produtos disponíveis.</p>";
        return;
    }

    products.forEach((product,index) => {

        const card = document.createElement("div");
        card.className = "product";

        const img = document.createElement("img");
        img.src = product.image;
        img.alt = product.name;

        const info = document.createElement("div");
        info.className = "product-info";

        info.innerHTML = `
            <h3>${escapeHTML(product.name)}</h3>
            <p class="description">${escapeHTML(product.description)}</p>
            <div class="price">${Number(product.price).toFixed(2)} €</div>
            <div class="stock">Stock: ${Number(product.stock)} unidades</div>
            <div class="stars">★★★★★ <span style="color:#888">Sem avaliações</span></div>
            <button onclick="orderProduct(${index})">Pedir informações</button>
        `;

        card.append(img,info);
        list.appendChild(card);

    });
}

// LOGIN ADMIN

function login() {

    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value;

    if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {

        isAdmin = true;

        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");

        renderAdminProducts();
        renderInbox();

    } else {

        document.getElementById("loginMessage").textContent =
        "Email ou palavra-passe incorretos.";

    }
}

function logout() {

    isAdmin = false;
    selectedAdminChat = null;

    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("adminPanel").classList.add("hidden");
    document.getElementById("adminChat").classList.add("hidden");

}

// IMAGENS

function readImage(file) {

    return new Promise((resolve,reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;

        reader.readAsDataURL(file);

    });
}

// ADICIONAR PRODUTO

async function addProduct() {

    if (!isAdmin) return;

    const name = document.getElementById("name").value.trim();
    const price = Number(document.getElementById("price").value);
    const stock = Number(document.getElementById("stock").value);
    const description = document.getElementById("description").value.trim();
    const file = document.getElementById("image").files[0];

    if (!name || !description || !file ||
        !Number.isFinite(price) || price <= 0 ||
        !Number.isInteger(stock) || stock < 0) {

        alert("Preenche todos os campos corretamente.");
        return;
    }

    if (file.size > 2 * 1024 * 1024) {
        alert("A imagem deve ter no máximo 2 MB.");
        return;
    }

    try {

        const image = await readImage(file);

        products.push({
            name,
            price,
            stock,
            description,
            image
        });

        saveProducts();
        renderProducts();
        renderAdminProducts();

        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("stock").value = "";
        document.getElementById("description").value = "";
        document.getElementById("image").value = "";

        alert("Produto publicado com sucesso!");

    } catch {
        alert("Erro ao carregar imagem.");
    }
}

function saveProducts() {
    localStorage.setItem("acornerProducts",JSON.stringify(products));
}

// ADMIN GERE PRODUTOS

function renderAdminProducts() {

    const area = document.getElementById("adminProducts");
    area.innerHTML = "<h3>Produtos publicados</h3>";

    products.forEach((product,index) => {

        const div = document.createElement("div");
        div.className = "admin-product";

        const title = document.createElement("strong");
        title.textContent = product.name;

        const info = document.createElement("p");
        info.textContent =
        `${Number(product.price).toFixed(2)} € · Stock: ${product.stock}`;

        const button = document.createElement("button");
        button.className = "delete-btn";
        button.textContent = "Apagar produto";
        button.onclick = () => deleteProduct(index);

        div.append(title,info,button);
        area.appendChild(div);

    });
}

function deleteProduct(index) {

    if (!isAdmin) return;

    if (confirm("Queres apagar este produto?")) {

        products.splice(index,1);

        saveProducts();
        renderProducts();
        renderAdminProducts();

    }
}

// MENSAGENS

function saveConversations() {
    localStorage.setItem("acornerMessages",JSON.stringify(conversations));
}

// ABRIR CONVERSA DO PRODUTO

function orderProduct(index) {

    selectedProductName = products[index].name;
    currentChatId = null;

    document.getElementById("chatProduct").textContent =
    "Produto: " + selectedProductName;

    document.getElementById("chatIdentity").classList.remove("hidden");
    document.getElementById("chatArea").classList.add("hidden");

    document.getElementById("clientName").value = "";
    document.getElementById("clientEmail").value = "";

    showPage("messages");
}

// COMEÇAR CONVERSA

function startChat() {

    const name = document.getElementById("clientName").value.trim();
    const email = document.getElementById("clientEmail").value.trim();

    if (!name || !email || !email.includes("@")) {
        alert("Preenche o nome e um email válido.");
        return;
    }

    const conversation = {
        id: Date.now().toString(),
        name,
        email,
        product: selectedProductName,
        messages: []
    };

    conversations.push(conversation);
    currentChatId = conversation.id;

    saveConversations();

    document.getElementById("chatIdentity").classList.add("hidden");
    document.getElementById("chatArea").classList.remove("hidden");

    renderClientChat();
    renderInbox();
}

// MOSTRAR MENSAGENS AO CLIENTE

function renderClientChat() {

    const conversation = conversations.find(
        chat => chat.id === currentChatId
    );

    if (!conversation) return;

    const area = document.getElementById("chatMessages");
    area.innerHTML = "";

    conversation.messages.forEach(message => {

        const div = document.createElement("div");
        div.className = "message " + message.sender;

        const text = document.createElement("div");
        text.textContent = message.text;

        const date = document.createElement("small");
        date.textContent = message.date;

        div.append(text,date);
        area.appendChild(div);

    });

    area.scrollTop = area.scrollHeight;
}

// CLIENTE ENVIA

function sendClientMessage() {

    const input = document.getElementById("chatInput");
    const text = input.value.trim();

    if (!text || !currentChatId) return;

    const conversation = conversations.find(
        chat => chat.id === currentChatId
    );

    if (!conversation) return;

    conversation.messages.push({
        sender: "client",
        text,
        date: new Date().toLocaleString("pt-PT")
    });

    input.value = "";

    saveConversations();
    renderClientChat();
    renderInbox();
}

// ADMIN VÊ CONVERSAS

function renderInbox() {

    const inbox = document.getElementById("adminInbox");
    if (!inbox) return;

    inbox.innerHTML = "";

    if (conversations.length === 0) {
        inbox.textContent = "Ainda não existem mensagens.";
        return;
    }

    conversations.forEach(chat => {

        const div = document.createElement("div");
        div.className = "chat-item";

        const title = document.createElement("strong");
        title.textContent = chat.name + " — " + chat.product;

        const email = document.createElement("p");
        email.textContent = chat.email;

        const button = document.createElement("button");
        button.textContent = "Abrir conversa";
        button.onclick = () => openAdminChat(chat.id);

        div.append(title,email,button);
        inbox.appendChild(div);

    });
}

// ADMIN ABRE CONVERSA

function openAdminChat(id) {

    if (!isAdmin) return;

    selectedAdminChat = id;

    const chat = conversations.find(item => item.id === id);
    if (!chat) return;

    document.getElementById("adminChat").classList.remove("hidden");
    document.getElementById("adminChatTitle").textContent =
    chat.name + " — " + chat.product;

    renderAdminChat();
}

// MOSTRAR MENSAGENS NO ADMIN

function renderAdminChat() {

    const chat = conversations.find(
        item => item.id === selectedAdminChat
    );

    if (!chat) return;

    const area = document.getElementById("adminChatMessages");
    area.innerHTML = "";

    chat.messages.forEach(message => {

        const div = document.createElement("div");
        div.className = "message " + message.sender;

        const text = document.createElement("div");
        text.textContent = message.text;

        const date = document.createElement("small");
        date.textContent = message.date;

        div.append(text,date);
        area.appendChild(div);

    });

    area.scrollTop = area.scrollHeight;
}

// ADMIN RESPONDE

function sendAdminReply() {

    if (!isAdmin || !selectedAdminChat) return;

    const input = document.getElementById("adminReply");
    const text = input.value.trim();

    if (!text) return;

    const chat = conversations.find(
        item => item.id === selectedAdminChat
    );

    if (!chat) return;

    chat.messages.push({
        sender: "admin",
        text,
        date: new Date().toLocaleString("pt-PT")
    });

    input.value = "";

    saveConversations();
    renderAdminChat();
    renderInbox();
}

function closeAdminChat() {

    selectedAdminChat = null;

    document.getElementById("adminChat").classList.add("hidden");
}

// ALTERAR LOGÓTIPO

async function changeLogo() {

    if (!isAdmin) return;

    const file = document.getElementById("logoImage").files[0];

    if (!file) {
        alert("Escolhe uma imagem primeiro.");
        return;
    }

    if (file.size > 2 * 1024 * 1024) {
        alert("A imagem deve ter no máximo 2 MB.");
        return;
    }

    try {

        const image = await readImage(file);

        localStorage.setItem("acornerLogo",image);

        showLogo();

        alert("Logótipo atualizado!");

    } catch {
        alert("Erro ao carregar logótipo.");
    }
}

// MOSTRAR LOGÓTIPO

function showLogo() {

    const image = localStorage.getItem("acornerLogo");
    const logo = document.getElementById("logo");

    if (image) {

        const img = document.createElement("img");
        img.src = image;
        img.alt = "Acorner";

        logo.replaceChildren(img);
    }
}

// INICIAR

renderProducts();
showLogo();

</script>

</body>
</html>

